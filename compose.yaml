
services:
  app:
    build: .
    image: ai-docker-lab:v1
    container_name: ai-docker-lab
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
